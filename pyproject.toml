[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elan-drivers"
version = "0.1.0"
description = "Modular device-driver framework for ELAN integrations."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["elan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
